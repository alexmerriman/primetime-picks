{% extends "base.html" %}

{% block title %}
Delete Programme
{% endblock %}

{% block main_content %}
<div class="form-card">
    <h1>Delete Programme</h1>

    <p>Are you sure you want to delete <strong>{{ programme.title }}</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="delete-button">Confirm Delete</button>
    </form>

    <p class="back-link">
        <a href="{% url 'programme_list' %}">← Cancel and go back</a>
    </p>
</div>
{% endblock %}
