{% extends "base.html" %}

{% block title %}
Delete Programme
{% endblock %}

{% block main_content %}
<h2>Delete Programme</h2>

<p>Are you sure you want to delete "{{ programme.title }}"?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Confirm Delete</button>
</form>

<p><a href="{% url 'programme_list' %}">Cancel</a></p>
{% endblock %}
