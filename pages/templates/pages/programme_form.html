{% extends "base.html" %}

{% block title %}
Programme Form
{% endblock %}

{% block main_content %}
<div class="form-card">
    <h1>Programme Form</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save Programme</button>
    </form>

    <p class="back-link">
        <a href="{% url 'programme_list' %}">← Back to programmes</a>
    </p>
</div>
{% endblock %}
