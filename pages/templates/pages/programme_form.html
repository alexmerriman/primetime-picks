{% extends "base.html" %}

{% block title %}
Programme Form
{% endblock %}

{% block main_content %}
<h2>Programme Form</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Save</button>
</form>

<p><a href="{% url 'programme_list' %}">Back to programmes</a></p>
{% endblock %}
